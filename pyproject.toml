[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-offline-map-generator"
version = "0.0.1"
description = "Version-locked, offline research implementation of Isaac floor generation"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
